<!DOCTYPE html>
<html>
<head>
    <title>Document</title>

    <style>
    *{
        box-sizing: border-box;
    }
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background-color: white;
    }
    header {
        background-color: #f5f8f9;
        padding: 15px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        box-shadow: 0 2px 4px lightgray;
    }
    header h2 {
        font-size: 20px;
        margin: 0 10px;
    }
    input {
        padding: 10px;
        width: 210px;
        border: 1px solid lightgray;
        border-radius: 4px;
    }
    button {
        padding: 10px;
        background-color: #555;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
    }
    button:hover {
        background-color: #333;
    }
    #title {
        text-align: center;
        margin: 20px;
    }
    #imageContainer {
        width: 85%;
        margin: 15px auto;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 12px;
    }
    #imageContainer img {
        width: 100%;
        height: 465px;
        object-fit: cover;
        border-radius: 6px;
        cursor: pointer;
    }
    #imageContainer img:hover {
        transform: scale(1.02);
        transition: 0.3s;
    }
    @media (max-width: 500px) {
    #imageContainer {
        grid-template-columns: 1fr;
    }
    }
    </style>
</head>

<body>

    <header>
    <h2>Unsplash API</h2>
    <input type="text" id="inputBox" value="Makkah" placeholder="Search for images">
    <button onclick="searchUsingXHR()">Search using XHR</button>
    <button onclick="searchUsingFetch()">Search using fetch (promises)</button>
    <button onclick="searchUsingFetchAwaitAsync()">Search using fetch (async/await)</button>
    </header>

    <h2 id="title"></h2>
    <div id="imageContainer"></div>


    <script>

    var accessKey = "mcBnGAZxndM48oFLIA3M3Ias_Icu9412CUr4b5ig5sY";

    function displayImages(data) {
    var container = document.getElementById("imageContainer");
    var titleElem = document.getElementById("title");
    container.innerHTML = "";
    //titleElem.innerText = "Search Results: " + data.results.length;
    //if (data.results.length == 0) {
        //container.innerHTML = "No images found!";
        //return;
    //}

    data.results.forEach(function(photo) {
        var img = document.createElement("img");
        img.src = photo.urls.regular;
        img.alt = photo.alt_description || "Unsplash image";
        container.appendChild(img);
    });
    }

    function searchUsingXHR() {
        var searchText = document.getElementById("inputBox").value;
        var xhr = new XMLHttpRequest();
        xhr.onreadystatechange = function() {
            if (this.readyState == 4 && this.status == 200) {
                var responseObj = JSON.parse(xhr.responseText);
                displayImages(responseObj);
            }
            else if (this.readyState == 4) {
                document.getElementById("title").innerText = "Error loading images!";
            }
        };
        xhr.open("GET", "https://api.unsplash.com/search/photos?query=" + searchText + "&per_page=8", true);
        xhr.setRequestHeader("Authorization", "Client-ID " + accessKey);
        xhr.send();
    }

    function searchUsingFetch() {
        var searchText = document.getElementById("inputBox").value;
        fetch("https://api.unsplash.com/search/photos?query=" + searchText + "&per_page=8", {
            headers: {
                "Authorization": "Client-ID " + accessKey
            }
        })
        .then(response => {
            return response.json();
        })
        .then(data => {
            displayImages(data);
        })
        .catch(error => {
            document.getElementById("title").innerText = "Error loading images!";
            console.log(error);
        });
    }

    async function searchUsingFetchAwaitAsync() {
        var searchText = document.getElementById("inputBox").value;
        try {
            let response = await fetch("https://api.unsplash.com/search/photos?query=" + searchText + "&per_page=8", {
                    headers: {
                        "Authorization": "Client-ID " + accessKey
                    }
                });
            let data = await response.json();
            if (!response.ok) {
                throw new Error("Request failed");
            }
            displayImages(data);
        }
        catch (error) {
            document.getElementById("title").innerText = "Error loading images!";
            console.log(error);
        }
    }

    document.getElementById("inputBox").addEventListener("keydown", function(event) {
    if (event.key == "Enter") {
        searchUsingFetchAwaitAsync();
    }
    });

    </script>

</body>
</html>
